e}}@media(max-width:650px){.decks{grid-template-columns:repeat(3,1fr);gap:15px}.table{border-width:8px;border-radius:25px;padding:18px 12px}.center{min-height:290px}.deck img{border-radius:8px}.deck span{font-size:11px}}</style><header><h1>GHETTO FABULOUS 🎤</h1><p>THE CARD TABLE · Interactive visual playtest</p></header><main class="table"><div class="decks" id="decks"></div><div class="center" id="center"><div class="instruction">Tap a deck to draw a card. It slides onto the table and reveals its story.</div></div><div class="actions"><button id="resolve" hidden>Resolve & discard</button><button class="alt" id="reset">Shuffle all decks</button></div></main><div class="foot">Concept demo only · Effects are examples, not connected to the full game economy · No existing game files changed</div><script>
